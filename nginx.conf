# Resolve the real visitor IP. Cloudflare sets CF-Connecting-IP; otherwise use
# the direct peer address. This keeps rate limiting per-visitor behind the proxy.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    # Framing: the portfolio (https://unnamed.codes) embeds this store, so the
    # store must be frameable by it. X-Frame-Options only understands DENY /
    # SAMEORIGIN (ALLOW-FROM is dead), so it is replaced by the CSP
    # frame-ancestors allowlist — the only header that can name origins.
    add_header Content-Security-Policy "frame-ancestors 'self' https://unnamed.codes https://www.unnamed.codes http://localhost:3002 http://localhost:5173" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # SPA — route all requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy API requests to the backend
    location /api/ {
        proxy_pass http://server:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://unnamed.codes https://www.unnamed.codes http://localhost:3002 http://localhost:5173" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
